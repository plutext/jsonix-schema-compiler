name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CR-002: JDK 11+ toolchain, Java 11 bytecode.
        java: ["11", "17", "21"]
    steps:
      - uses: actions/checkout@v5
      # tests/typescript installs the @docx4j/jsonix runtime (^3.2.0) from npm.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and run unit + integration tests (npm module excluded)
        run: ./mvnw -B -ntp clean install -Ptests -pl '!npm'
      - name: Smoke-test the CLI jar against the purchase-order sample
        run: |
          mkdir -p target/smoke
          # The glob also matches the -sources jar, which sorts first in the runner's C locale.
          JAR="$(ls full/target/jsonix-schema-compiler-full-*.jar | grep -v -- '-sources')"
          java -jar "$JAR" \
            -d target/smoke -generateJsonSchema -generateTypeScript \
            samples/po/src/main/resources/purchaseorder.xsd \
            -b samples/po/src/main/resources/bindings.xjb
          test -s target/smoke/PurchaseOrder.std.js
          test -s target/smoke/PurchaseOrder.cmp.js
          test -s target/smoke/PurchaseOrder.jsonschema
          test -s target/smoke/PurchaseOrder.d.ts
          test -s target/smoke/PurchaseOrder.std.d.ts
      - name: Verify no system-scoped dependencies of our own
        run: |
          ./mvnw -B -q -ntp -Ptests -pl '!npm' dependency:tree -DoutputFile=target/tree.txt -DappendOutput=true
          ! grep ':system' target/tree.txt
